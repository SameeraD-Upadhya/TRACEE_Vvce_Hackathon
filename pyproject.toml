[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracee-dfir"
version = "0.2.0"
description = "Threat Reconstruction & Cyber Evidence Engine"
readme = "ReadMe.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27,<1.0",
    "httpx2>=2.0,<3.0",
]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
tracee = "tracee.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracee*", "parsers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
